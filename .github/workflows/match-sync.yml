name: Match Sync

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes, 24/7
  workflow_dispatch:           # manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger match sync
        run: |
          curl -fsS --max-time 60 --connect-timeout 10 \
            -X POST "${{ secrets.APP_URL }}/api/sync/matches" \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}"
